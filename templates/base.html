{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="{% block meta_description %}Code Nest — Learn programming, build projects, and grow your skills.{% endblock %}"
    >

    <title>
        {% block title %}
            Code Nest
        {% endblock %}
    </title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/pro.css' %}">
    
    {% block extra_css %}{% endblock %}

</head>

<body>

    {% include 'navbar.html' %}


    <main>

        {% block content %}
        {% endblock %}

    </main>


    {% include 'footer.html' %}


    <script src="{% static 'js/base.js' %}"></script>

    {% block extra_js %}{% endblock %}

</body>

</html>

{% load static %}

<nav class="navbar">

    <div class="navbar-container">

        <!-- Brand -->
        <a href="#" class="navbar-brand">

            <span class="brand-mark">&lt;/&gt;</span>

            <span class="brand-name">
                Code <strong>Nest</strong>
            </span>

        </a>


        <!-- Desktop Navigation -->
        <div class="navbar-links">

            <a href="/" class="nav-link active">
                Home
            </a>

            <a href="#" class="nav-link">
                Tutorials
            </a>

            <a href="{% url 'blog:allposts' %}" class="nav-link">
                Blog
            </a>

            <a href="/about/" class="nav-link">
                About
            </a>

        </div>


        <!-- Actions -->
        <div class="navbar-actions">

            {% if user.is_authenticated %}

                <a href="{% url 'accounts:profile' %}" class="nav-profile">
                    {{ user.username }}
                </a>

                <a
                    href="{% url 'accounts:logout' %}"
                    class="nav-button nav-button-outline"
                >
                    Logout
                </a>

            {% else %}

                <a
                    href="{% url 'accounts:login' %}"
                    class="nav-login"
                >
                    Login
                </a>

                <a
                    href="{% url 'accounts:register' %}"
                    class="nav-button"
                >
                    Get Started
                </a>

            {% endif %}

        </div>


        <!-- Mobile Menu Button -->
        <button
            type="button"
            class="mobile-menu-button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="mobileNavigation"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </div>


    <!-- Mobile Navigation -->
    <div
        class="mobile-navigation"
        id="mobileNavigation"
    >

        <div class="mobile-navigation-links">

            <a href="/" class="mobile-nav-link active">
                Home
            </a>

            <a href="#" class="mobile-nav-link">
                Tutorials
            </a>

            <a href="{% url 'blog:allposts' %}" class="mobile-nav-link">
                Blog
            </a>

            <a href="about/" class="mobile-nav-link">
                About
            </a>

        </div>


        <div class="mobile-navigation-actions">

            {% if user.is_authenticated %}

                <a href="#" class="mobile-profile">
                    {{ user.username }}
                </a>

                <a
                    href="{% url 'accounts:logout' %}"
                    class="mobile-button"
                >
                    Logout
                </a>

            {% else %}

                <a
                    href="{% url 'accounts:login' %}"
                    class="mobile-login"
                >
                    Login
                </a>

                <a
                    href="{% url 'accounts:register' %}"
                    class="mobile-button"
                >
                    Get Started
                </a>

            {% endif %}

        </div>

    </div>

</nav>
